<header class="mb-12">
<p class="font-label text-[10px] uppercase tracking-[0.3rem] text-on-surface-variant mb-4">Volume V: Nocturnal</p>
<h1 class="font-headline italic text-4xl text-on-surface tracking-tight">ENTER THE ARCHIVE</h1>

                            Initiate Username
                        </label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant focus:border-primary focus:ring-0 text-on-surface font-body text-lg py-2 transition-all px-0" id="username" name="username" placeholder="V.TEPES" type="text"/>
</div>
<!-- Password Field -->
<div class="group">
<label class="block font-label text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-2 transition-colors group-focus-within:text-primary" for="password">

                        </label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant focus:border-primary focus:ring-0 text-on-surface font-body text-lg py-2 transition-all px-0" id="password" name="password" placeholder="••••••••" type="password"/>
</div>

<button class="w-full blood-pulse text-on-primary font-label font-black text-xs uppercase tracking-[0.2rem] py-5 rounded-none shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-3" type="submit">

<span class="material-symbols-outlined text-sm">login</span>

<div class="h-px flex-1 bg-outline-variant opacity-30"></div>
</div>
<button class="w-full border border-outline-variant text-on-surface-variant font-label text-[10px] uppercase tracking-[0.15rem] py-4 hover:bg-surface-container transition-all">
